<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI/CD Pipeline Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container { text-align: center; padding: 40px; }
        h1 { font-size: 3rem; color: #00d4ff; margin-bottom: 10px; }
        .subtitle { color: #aaa; margin-bottom: 40px; }
        .pipeline {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 30px 0;
        }
        .stage {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid #00d4ff;
            padding: 15px 20px;
            border-radius: 10px;
            min-width: 120px;
        }
        .stage .icon { font-size: 2rem; }
        .stage .label { font-size: 0.8rem; color: #00d4ff; margin-top: 5px; }
        .arrow { font-size: 1.5rem; color: #00d4ff; }
        .status { 
            background: rgba(0, 255, 100, 0.1); 
            border: 1px solid #00ff64;
            padding: 15px 30px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 20px;
            color: #00ff64;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 CI/CD Pipeline</h1>
        <p class="subtitle">Automated Deployment Demo</p>
        
        <div class="pipeline">
            <div class="stage"><div class="icon">💻</div><div class="label">GitHub</div></div>
            <div class="arrow">→</div>
            <div class="stage"><div class="icon">🔧</div><div class="label">Jenkins</div></div>
            <div class="arrow">→</div>
            <div class="stage"><div class="icon">🐳</div><div class="label">Docker</div></div>
            <div class="arrow">→</div>
            <div class="stage"><div class="icon">☁️</div><div class="label">Azure</div></div>
            <div class="arrow">→</div>
            <div class="stage"><div class="icon">▲</div><div class="label">Vercel</div></div>
        </div>

        <div class="pipeline" style="margin-top: 20px;">
            <div class="stage"><div class="icon">🔐</div><div class="label">SonarQube</div></div>
            <div class="stage"><div class="icon">🛡️</div><div class="label">OWASP Check</div></div>
        </div>
        
        <div class="status">✅ Pipeline Status: All Systems Go!</div>
    </div>
</body>
</html>
